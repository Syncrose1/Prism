# Allow user services to lock memory.
#
# Prism calls mlockall() so it cannot be paged out under the memory pressure it
# exists to resolve — being swapped out at that moment is how a watchdog becomes
# another casualty rather than a rescue.
#
# The default is 8 MiB, which is checked against a process's *virtual* size, not
# its resident size. prismd is ~6 MiB resident but ~280 MiB virtual (thread
# stacks and allocator arenas), so the call fails at the default.
#
# Install:
#   sudo install -Dm644 systemd/50-prism-memlock.conf \
#        /etc/systemd/user.conf.d/50-prism-memlock.conf
#
# Takes effect for the user manager at next login or reboot.
[Manager]
DefaultLimitMEMLOCK=infinity
