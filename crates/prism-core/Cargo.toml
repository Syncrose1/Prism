[package]
name = "prism-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
regex.workspace = true
tracing.workspace = true

# Auth primitives. Deliberately small and well-known rather than a batteries
# -included OTP crate: TOTP is ~40 lines and the RFC ships test vectors, so
# hand-rolling it is both auditable and verifiable. See auth/totp.rs.
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
# Password hashing. Argon2id is the current recommendation: memory-hard, so a
# stolen hash is expensive to attack even with a GPU.
argon2 = "0.6"

# statvfs for the disk sensor. Also the only sane route to mlockall later.
libc = "0.2"

# `sync` only — broadcast channels for terminal output fan-out. This feature
# pulls in no runtime, so prism-core stays executor-agnostic and the monitor
# loop remains free of async.
tokio = { version = "1", features = ["sync"] }
