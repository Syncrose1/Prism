[package]
name = "prismd"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
prism-core = { path = "../prism-core" }
anyhow.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc = "0.2"

# Minimal runtime: no fs/process/time features pulled in beyond what the server
# needs. The monitor loop stays synchronous on its own thread so pressure
# handling never waits on an async runtime that is itself starved.
axum = { version = "0.8", features = ["ws"] }
# Splitting the WebSocket into an independent sink and stream, so terminal
# output can be pumped while keystrokes are read concurrently.
futures-util = { version = "0.3", default-features = false }

# The shell is embedded in the binary: one artefact to deploy, no build step,
# and nothing to fetch at first paint. See ADR 0001.
rust-embed = "8"
# Proxying to locally-running apps. hyper directly rather than a client crate:
# the requirement is to forward bytes and upgrade WebSockets untouched, not to
# model requests.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
# Some apps insist on TLS even on loopback (Syncthing redirects http->https on
# its own port). Proxying to them needs an HTTPS client. See proxy.rs for why
# certificate verification is skipped for loopback specifically.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "webpki-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Streaming file bodies. Reading a 20 GB model into memory to serve it would be
# a memory incident caused by the memory-incident daemon.
tokio-util = { version = "0.7", features = ["io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "process", "time"] }
